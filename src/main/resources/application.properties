spring.application.name=univent-backend

# A fresh clone runs with an in-memory database. Team members can point the
# same application at MySQL by supplying DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:univent;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Development-only fallback. Supply JWT_SECRET outside local development.
jwt.secret=${JWT_SECRET:univent-local-development-secret-key-change-me}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}
