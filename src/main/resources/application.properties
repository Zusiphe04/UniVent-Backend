spring.application.name=univent-backend

# Connect to the local MySQL server by default. Override credentials with
# environment variables; the database is created if it does not already exist.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/univent?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:shaun.}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Development-only fallback. Supply JWT_SECRET outside local development.
jwt.secret=${JWT_SECRET:univent-local-development-secret-key-change-me}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.auth.admin-registration-enabled=${ADMIN_REGISTRATION_ENABLED:false}

server.port=${SERVER_PORT:8081}
